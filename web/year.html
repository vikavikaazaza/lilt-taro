<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Прогноз на год</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090817;color:#f0eaf6;font-family:Arial,sans-serif}
.app{max-width:620px;margin:auto;padding:18px 14px 28px}
.title{font-size:27px;font-weight:700;color:#f4e8c8}
.sub{margin:8px 0 16px;color:#aaa2bc;line-height:1.5}
.card{background:#15112a;border:1px solid #302a52;border-radius:18px;padding:16px}
.field{margin-bottom:13px}
.label{display:block;font-size:13px;color:#c8bed1;margin-bottom:6px}
.input{width:100%;padding:12px;border:1px solid #3a315a;border-radius:11px;background:#0d0c1c;color:#f0eaf6;font-size:16px;outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkline{display:flex;gap:7px;align-items:center;font-size:12px;color:#8f879f;margin-top:7px}
.city-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.secondary{border:1px solid #3a315a;background:#211d38;color:#ead9b6;border-radius:11px;padding:11px 13px}
.suggestions{margin-top:7px;border:1px solid #302a52;border-radius:12px;overflow:hidden;background:#0d0c1c}
.suggestion{padding:11px 12px;border-bottom:1px solid #292440}
.hint{font-size:12px;color:#8f879f;line-height:1.45;margin-top:8px}
.submit{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(90deg,#d7bb73,#b99844);color:#171225;font-size:16px;font-weight:700;cursor:pointer}
.submit:disabled{opacity:.6;cursor:default}
.status{min-height:22px;margin-top:11px;color:#aaa2bc;font-size:13px;line-height:1.45}
@media(max-width:600px){
  .row{grid-template-columns:1fr}
  .title{font-size:24px}
}
</style>
</head>

<body>
<main class="app">
  <div class="title">🌙 Прогноз на год</div>
  <div class="sub">Персональный прогноз на год по натальной карте: главные темы, сильные периоды, конкретные сценарии и календарь событий по месяцам.</div>

  <div class="card">
    <div class="field">
      <label class="label">Имя</label>
      <input id="name" class="input" placeholder="Например: Виктория">
    </div>

    <div class="row">
      <div class="field">
        <label class="label">Дата рождения</label>
        <input id="birth-date" class="input" type="date" min="1900-01-01" max="2200-12-31" required>
      </div>

      <div class="field">
        <label class="label">Время рождения</label>
        <input id="birth-time" class="input" type="time">
        <label class="checkline">
          <input id="unknown-time" type="checkbox"> Не знаю время
        </label>
      </div>
    </div>

    <div class="field">
      <label class="label">Город рождения</label>
      <div class="city-row">
        <input id="city" class="input" placeholder="Начни вводить город">
        <button id="city-clear" class="secondary" type="button">Очистить</button>
      </div>
      <div id="suggestions" class="suggestions" hidden></div>
    </div>

    <div class="field">
      <label class="label">Год прогноза</label>
      <select id="year" class="input"></select>
    </div>

    <div class="hint">
      Если время рождения неизвестно, прогноз остаётся рабочим, но точные выводы по домам и Асценденту не используются.
    </div>

    <button id="submit" class="submit" type="button">Получить прогноз на год</button>
    <div id="status" class="status"></div>
  </div>
</main>

<!-- Telegram Mini Apps SDK. Должен быть подключён ДО основного скрипта. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
const tg = window.Telegram?.WebApp || null;

if (tg) {
  try {
    tg.ready();
    tg.expand();
  } catch (e) {
    console.warn('Telegram WebApp initialization error:', e);
  }
}

const initData = tg?.initData || '';

const nameEl = document.getElementById('name');
const bd = document.getElementById('birth-date');
const bt = document.getElementById('birth-time');
const unk = document.getElementById('unknown-time');
const city = document.getElementById('city');
const sugg = document.getElementById('suggestions');
const yearEl = document.getElementById('year');
const status = document.getElementById('status');
const submit = document.getElementById('submit');

const now = new Date().getFullYear();

for (let y = now; y <= now + 3; y++) {
  const o = document.createElement('option');
  o.value = y;
  o.textContent = y;
  yearEl.appendChild(o);
}

yearEl.value = now;

let selectedCity = null;
let timer = null;
let submitting = false;

function showStatus(text) {
  status.textContent = text || '';
}

function valid() {
  if (!tg || !initData) {
    showStatus('Приложение нужно открыть через кнопку приложения в Telegram.');
    return false;
  }

  if (!bd.value) {
    showStatus('Укажи дату рождения.');
    return false;
  }

  if (!unk.checked && !bt.value) {
    showStatus('Укажи время рождения или отметь «Не знаю время».');
    return false;
  }

  if (!selectedCity) {
    showStatus('Выбери город рождения из найденных вариантов.');
    return false;
  }

  return true;
}

unk.addEventListener('change', () => {
  bt.disabled = unk.checked;

  if (unk.checked) {
    bt.value = '';
  }
});

city.addEventListener('input', () => {
  selectedCity = null;
  clearTimeout(timer);

  const q = city.value.trim();

  if (q.length < 2) {
    sugg.hidden = true;
    return;
  }

  timer = setTimeout(async () => {
    try {
      const r = await fetch('/api/year/cities?q=' + encodeURIComponent(q));

      if (!r.ok) {
        throw new Error('Ошибка поиска города');
      }

      const d = await r.json();

      sugg.innerHTML = '';

      (d.cities || []).forEach(x => {
        const e = document.createElement('div');
        e.className = 'suggestion';
        e.textContent = x.display_name;

        e.onclick = () => {
          selectedCity = x;
          city.value = x.display_name;
          sugg.hidden = true;
        };

        sugg.appendChild(e);
      });

      sugg.hidden = !(d.cities || []).length;
    } catch (e) {
      console.error(e);
      sugg.hidden = true;
    }
  }, 450);
});

document.getElementById('city-clear').onclick = () => {
  city.value = '';
  selectedCity = null;
  sugg.hidden = true;
};

async function loadProfile() {
  if (!initData) {
    return;
  }

  try {
    const r = await fetch(
      '/api/year/profile?initData=' + encodeURIComponent(initData),
      { cache: 'no-store' }
    );

    if (!r.ok) {
      return;
    }

    const d = await r.json();
    const p = d.profile;

    if (!p) {
      return;
    }

    nameEl.value = p.name || '';
    bd.value = p.birth_date || '';

    if (p.time_known) {
      bt.value = p.birth_time || '';
      unk.checked = false;
      bt.disabled = false;
    } else {
      unk.checked = true;
      bt.disabled = true;
    }

    city.value = p.city || '';

    selectedCity = p.city
      ? {
          display_name: p.city,
          lat: p.lat,
          lon: p.lon
        }
      : null;
  } catch (e) {
    console.warn('Profile loading error:', e);
  }
}

loadProfile();

submit.onclick = async () => {
  if (submitting || !valid()) {
    return;
  }

  submitting = true;
  submit.disabled = true;

  showStatus('Данные приняты. Считаю год и готовлю персональный PDF…');

  try {
    const payload = {
      initData,
      name: nameEl.value.trim(),
      birth_date: bd.value,
      birth_time: unk.checked ? '' : bt.value,
      time_known: !unk.checked,
      year: Number(yearEl.value),
      city: selectedCity.display_name,
      lat: selectedCity.lat,
      lon: selectedCity.lon
    };

    const r = await fetch('/api/year/calculate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    const d = await r.json().catch(() => ({}));

    if (!r.ok) {
      throw new Error(d.detail || 'Не удалось запустить прогноз');
    }

    showStatus('Прогноз запущен ✨ Вернись в Telegram — Лилит пришлёт PDF.');

    try {
      tg?.HapticFeedback?.impactOccurred?.('medium');
    } catch (e) {}

    setTimeout(() => {
      try {
        tg?.close?.();
      } catch (e) {}
    }, 900);

  } catch (e) {
    console.error(e);
    submitting = false;
    submit.disabled = false;
    showStatus(e.message || 'Не удалось запустить прогноз.');
  }
};
</script>
</body>
</html>
