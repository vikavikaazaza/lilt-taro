<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Лилит — Карты</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#08091b;color:#f4e8c5;font-family:Georgia,"Times New Roman",serif}body{background:radial-gradient(circle at 50% -10%,#25164b 0,#0b0a20 38%,#080817 100%)}.app{max-width:720px;margin:auto;padding:20px 14px 38px}.head{text-align:center;padding:6px 8px 8px}.moon{width:50px;height:50px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle at 35% 35%,#fff6d5,#e4c77e 48%,#a17b35);box-shadow:0 0 18px #d6b86a80,0 0 45px #875bca40;position:relative}.moon:after{content:"";position:absolute;width:44px;height:44px;top:-3px;right:-5px;border-radius:50%;background:#08091b}.logo{letter-spacing:5px;font-size:13px;color:#d7bb73;margin-bottom:5px}h1{font-weight:normal;font-size:25px;margin:0}.sub{margin:8px 0;color:#aaa2bc;font-size:14px;line-height:1.45}.counter{padding:12px 14px;margin:12px 0 14px;border:1px solid #5a4b78;border-radius:14px;text-align:center;background:#14112a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{perspective:900px;aspect-ratio:2/3;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.card.selected .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;overflow:hidden;border:1px solid #574975;background:#17132b;box-shadow:0 7px 20px #0005}.face img{width:100%;height:100%;display:block;object-fit:cover}.front{transform:rotateY(180deg)}.card.selected .front{border:2px solid #d7bb73;box-shadow:0 0 18px #d7bb7350}.go{position:sticky;bottom:12px;width:100%;padding:14px;margin-top:18px;border:0;border-radius:13px;background:#d7bb73;color:#171225;font-size:16px;font-weight:bold}.go:disabled{opacity:.65}.hint{text-align:center;color:#aaa2bc;font-size:13px}.hidden{display:none}@media(max-width:430px){.grid{grid-template-columns:repeat(4,1fr);gap:7px}.app{padding-left:9px;padding-right:9px}}
</style></head><body><div class="app"><div class="head"><div class="moon"></div><div class="logo">LILIT TARO</div><h1 id="title">Выберите карты</h1><div class="sub" id="subtitle">Выбирайте интуитивно. Нажмите на карту, чтобы открыть её.</div></div><div class="counter">Выбрано: <b id="count">0</b> из <b id="max">3</b></div><main id="grid" class="grid"></main><button id="send" class="go hidden">Завершить расклад</button><p class="hint">Карты не повторяются. После выбора изменить набор можно до завершения расклада.</p></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const qs=new URLSearchParams(location.search);const deck=qs.get('deck')||'waite',mode=qs.get('mode')||'free';const max=deck==='day'?1:(mode==='premium'?9:3);document.getElementById('max').textContent=max;const grid=document.getElementById('grid'),count=document.getElementById('count'),send=document.getElementById('send');let selected=[];
function makeCard(c){const el=document.createElement('div');el.className='card';el.innerHTML='<div class="inner"><div class="face back"><img src="/cards/card-back.jpeg"></div><div class="face front"><img alt=""></div></div>';const im=el.querySelector('.front img');im.src=c.image;im.onerror=()=>{im.src='/cards/card-back.jpeg'};el.onclick=()=>{const has=selected.some(x=>x.id===c.id);if(has){selected=selected.filter(x=>x.id!==c.id);el.classList.remove('selected')}else if(selected.length<max){selected.push(c);el.classList.add('selected')}count.textContent=selected.length;send.classList.toggle('hidden',selected.length!==max)};return el}
async function load(){const r=await fetch('/api/miniapp/config?deck='+encodeURIComponent(deck));if(!r.ok)throw Error('Не удалось загрузить колоду');const d=await r.json();for(const c of d.cards)grid.appendChild(makeCard(c))}
send.onclick=async()=>{send.disabled=true;send.textContent='Отправляем...';try{if(!tg?.initData)throw Error('Откройте Mini App из Telegram');const r=await fetch('/api/miniapp/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,deck,mode,count:max,cards:selected.map(c=>({id:c.id,name:c.name}))})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Не удалось завершить расклад');tg.close()}catch(e){alert(e.message);send.disabled=false;send.textContent='Завершить расклад'}};load().catch(e=>{document.getElementById('subtitle').textContent=e.message;console.error(e)});
</script></body></html>
