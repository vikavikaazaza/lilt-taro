<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Лилит</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#08091b;color:#ead39b;font-family:Georgia,serif}
.app{max-width:760px;margin:auto;padding:16px}.top{text-align:center;margin-bottom:12px}.sub{font:13px Arial;color:#bcae8c;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{aspect-ratio:.55;perspective:900px;cursor:pointer}
.inner{height:100%;position:relative;transform-style:preserve-3d;transition:.45s}.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;overflow:hidden;border:1px solid #b89b57}
.back{background:#111329 url('/cards/card-back.jpeg') center/100% 100% no-repeat}.front{transform:rotateY(180deg);background:#111}
.front img{width:100%;height:100%;object-fit:cover;display:block}.selected{pointer-events:none}
.counter{text-align:center;margin:12px;font:12px Arial;color:#d9bd70}
</style></head><body><main class="app">
<div class="top"><div>✦ Выберите карты ✦</div><div class="sub">Нажмите на карты по очереди</div></div>
<div id="counter" class="counter">Загрузка карт...</div><div id="grid" class="grid"></div>
</main><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const p=new URLSearchParams(location.search),deck=p.get('deck')||'waite',mode=p.get('mode')==='premium'?'premium':'free';
const max=deck==='day'?1:(mode==='premium'?9:3),grid=document.getElementById('grid'),counter=document.getElementById('counter');

function submitAndClose(cards){
  const payload=JSON.stringify({initData:tg?.initData||'',deck,mode,cards});
  let sent=false;
  try{sent=navigator.sendBeacon('/api/miniapp/select',new Blob([payload],{type:'application/json'}));}catch(e){}
  if(!sent){try{fetch('/api/miniapp/select',{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).catch(()=>{});}catch(e){}}
  // Закрываем сразу, не ожидая ответа ИИ.
  try{tg?.close();}catch(e){}
}
async function loadCards(){
  try{
    const r=await fetch('/api/miniapp/config?deck='+encodeURIComponent(deck),{cache:'no-store'});
    if(!r.ok)throw Error('HTTP '+r.status);
    const data=await r.json(),cards=(data.cards||[]).filter(x=>x.image).sort(()=>Math.random()-.5);
    if(!cards.length)throw Error('no cards');
    counter.textContent=`Выбрано: 0 / ${max}`;
    const selected=[];
    cards.forEach(card=>{
      const e=document.createElement('div');e.className='card';
      e.innerHTML=`<div class="inner"><div class="face back"></div><div class="face front"><img src="${card.image}" alt=""></div></div>`;
      e.onclick=()=>{
        if(selected.length>=max||selected.some(x=>x.id===card.id))return;
        selected.push({id:card.id,name:card.name});e.classList.add('flip','selected');
        counter.textContent=`Выбрано: ${selected.length} / ${max}`;
        if(selected.length===max)submitAndClose(selected);
      };grid.appendChild(e);
    });
  }catch(e){counter.textContent='Не удалось загрузить карты';console.error(e);}
}
loadCards();
</script></body></html>
